name: Build Android APK

on:
  push:
    branches:
      - 'feat/android-env-check'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  android-apk:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install dependencies & regenerate l10n
        run: |
          flutter --version
          flutter pub get
          dart run intl_utils:generate

      - name: Analyze & run tests
        shell: bash
        run: |
          flutter analyze --no-fatal-infos
          set +e
          flutter test -r expanded test/views/environment_check_test.dart test/l10n test/lint > /tmp/test.log 2>&1
          code=$?
          cat /tmp/test.log
          if [ $code -ne 0 ]; then
            grep -E '\[E\]|Expected:|Actual:|Which:|Exception|Error|FAIL' /tmp/test.log | head -n 20 | while IFS= read -r line; do
              echo "::error::TEST_FAIL: $line"
            done
          fi
          exit $code

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android arm64 APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          set +e
          flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=APP_ENV=pre > /tmp/build.log 2>&1
          code=$?
          tail -n 120 /tmp/build.log
          if [ $code -ne 0 ]; then
            grep -iE 'error:|exception|failed|failure|what went wrong' /tmp/build.log | tail -n 25 | while IFS= read -r line; do
              echo "::error::BUILD_FAIL: $line"
            done
          fi
          exit $code

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-android-arm64-apk
          path: build/app/outputs/flutter-apk/*.apk
          overwrite: true
